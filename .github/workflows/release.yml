
name: Build and Release MyLang

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version does not match package.json"
            exit 1
          fi

      - name: Package VSIX
        shell: bash
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce@4 package \
            --allow-missing-repository \
            --out "dist/MyLang-${GITHUB_REF_NAME}.vsix"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MyLang-${GITHUB_REF_NAME}.vsix" \
            --title "MyLang $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
