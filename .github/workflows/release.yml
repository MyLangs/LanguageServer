
name: Build and Release MyLang

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Test, Build and Upload VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag must be v$VERSION"
            exit 1
          fi

      - name: Build VSIX
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist

          npx --yes @vscode/vsce@4 package \
            --allow-missing-repository \
            --out "dist/MyLang-${RELEASE_TAG}.vsix"

      - name: Upload VSIX to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/MyLang-${RELEASE_TAG}.vsix" \
            --clobber
